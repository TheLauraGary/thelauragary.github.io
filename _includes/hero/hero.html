{% assign large_avif = include.large_url | replace: '.png', '.avif' %}
{% assign small_avif = include.small_url | replace: '.png', '.avif' %}
<div class="container-fluid p-0 hero">
  <div class="row h-100 g-0">
    <div class="col-12 h-100 position-relative">
      <picture>
        <source media="(min-width: 768px)" srcset="{{ large_avif }}" type="image/avif" width="1920" height="1080">
        <source media="(min-width: 768px)" srcset="{{ include.large_url }}" type="image/png" width="1920" height="1080">
        <source srcset="{{ small_avif }}" type="image/avif" width="1200" height="800">
        <img src="{{ include.small_url }}" alt="{{ include.alt }}" width="1200" height="800"
          class="object-fit-cover w-100 h-100 d-block" fetchpriority="high" decoding="async">
      </picture>
      <div class="position-absolute top-50 start-50 translate-middle text-center w-100">
        <h1>{{ include.text_overlay }}</h1>
      </div>
    </div>
  </div>
</div>
